    unit: Stunden
    range: [3, 23]
    sentence: "Bei Fristsachen von {party} gilt intern eine Reaktionszeit von {value}."
    probe: "Welche interne Reaktionszeit gilt bei Fristsachen von {party}?"
  - doc_type: Dienstvertrag
    unit: Wochen
    range: [7, 23]
