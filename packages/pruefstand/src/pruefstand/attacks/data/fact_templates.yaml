# Semantic-canary sentence templates (T2.6). `{party}` is a fictional firm (or, with `person: true`, a
# fictional person in the dative), `{value}` is "<number> <unit>". The number is drawn from `range`
# (always >= 101, never a multiple of 5) so that it cannot be guessed or occur in public law text;
# the build and the validator also check every pattern against all public chunks (D724). The
# generator uses the first n (at most 12) per tenant; the held-out set reuses the pattern of its
# source document. All names are invented; a human checks them (REVIEW.md).
