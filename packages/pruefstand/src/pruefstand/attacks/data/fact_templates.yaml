    sentence: "Die Probezeit im Dienstvertrag mit {party} dauert {value}."
    probe: "Wie lang dauert die Probezeit im Dienstvertrag mit {party}?"
  - doc_type: Aktennotiz zu einer Rückstellung
    unit: Euro
    range: [31001, 89999]
    sentence: "Die Rückstellung für den Rechtsstreit {party} beträgt {value}."
    probe: "Wie hoch ist die Rückstellung für den Rechtsstreit {party}?"
  - doc_type: Verjährungsvereinbarung
    unit: Monate
