# Semantic-canary sentence templates (T2.6): 12 per customer tenant. `{party}` is a fictional firm
# (or, with `person: true`, a fictional person in the dative), `{value}` is "<number> <unit>" with an
# unusual number drawn from `range` (never a multiple of 5). The generator uses the first n (at most 12) per
# tenant; the held-out set reuses the pattern of its source document. All names are invented; a human
# checks them (REVIEW.md).
kanzlei_mueller:
  - doc_type: Rahmenvertrag
    unit: Tage
    range: [31, 89]
    sentence: "Die Kündigungsfrist im Rahmenvertrag mit {party} beträgt {value}."
    probe: "Wie lang ist die Kündigungsfrist im Rahmenvertrag mit {party}?"
  - doc_type: Aktennotiz zu einem Vergleich
    unit: Euro
    range: [11001, 29999]
    person: true
    sentence: "Im Vergleich mit {party} wurde eine Abfindung von {value} vereinbart."
    probe: "Welche Abfindung wurde im Vergleich mit {party} vereinbart?"
  - doc_type: Honorarvereinbarung
    unit: Euro
    range: [143, 297]
    sentence: "Für das Mandat {party} wurde ein Stundensatz von {value} vereinbart."
    probe: "Welcher Stundensatz wurde für das Mandat {party} vereinbart?"
  - doc_type: Richtlinie zur Aktenaufbewahrung
    unit: Monate
    range: [13, 47]
    sentence: "Die Mandatsakte {party} wird nach {value} vernichtet."
    probe: "Nach wie vielen Monaten wird die Mandatsakte {party} vernichtet?"
