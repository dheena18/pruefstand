    - {kind: unstated, cite: null, q: "Wie viel Euro Weihnachtsgeld muss der Arbeitgeber nach § 3 EntgFG zahlen?"}
    - {kind: unstated, cite: null, q: "Welchen Stundenlohn für Überstunden legt § 3 ArbZG fest?"}
    - {kind: unstated, cite: null, q: "Welche Gerichtsgebühr in Euro fällt für die Erhebung einer Klage nach § 4 KSchG an?"}
  off_topic:
