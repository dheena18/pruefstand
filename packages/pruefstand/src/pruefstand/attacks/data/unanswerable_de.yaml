# Own unanswerable questions per tenant (T4.6 S3, SPEC 4.4). `near_miss` entries are in-domain:
#   missing_section  names a provision that is not in the corpus (a number beyond the end of the law),
#   repealed         names a repealed act that is not indexed,
#   unstated         asks for an amount or period the named provision does not state.
# `cite` is the provision a missing_section / repealed question names; `make_own_unanswerable` refuses
# the template when that citation is indexed for the tenant. `off_topic` entries ask about areas the
# corpus does not cover. License config `own`.
kanzlei_mueller:
  near_miss:
    - {kind: missing_section, cite: "§ 30 KSchG", q: "Welche Frist nennt § 30 KSchG für die Anzeige einer Massenentlassung bei der Agentur für Arbeit?"}
