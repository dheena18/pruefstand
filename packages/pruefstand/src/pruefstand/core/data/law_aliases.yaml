# T2.4 appends EU acts, T4.4 reads it, nobody keeps a copy.
# T4.4: the alias starting with `des`/`der` is the genitive phrase `perturb.citation_style` writes out (one per law).
# Shape: <scope>: {<canonical abbreviation>: [aliases]}. The abbreviation itself is always an alias.
# `national` = German federal statutes (cited with § or Art.); `eu` = EU acts (cited with Art.).
