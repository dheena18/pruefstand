- request:
    question: Wann ist die Kündigung eines Dienstverhältnisses, das kein Arbeitsverhältnis ist, bei tageweise
      bemessener Vergütung zulässig?
    tenant_id: kanzlei_mueller
  response:
    body:
      answer: '1. Tageweise bemessener Vergütung: am ersten Werktag einer Woche für den Ablauf des folgenden
        Tages.'
      chunks:
      - chunk_id: gii-bgb-621#0
        doc_id: gii-bgb-621
        rank: 1
        score: 1.0
        tenant_id: shared_public
        text: 'Bei einem Dienstverhältnis, das kein Arbeitsverhältnis im Sinne des § 622 ist, ist die
          Kündigung zulässig,

          1. wenn die Vergütung nach Tagen bemessen ist, an jedem Tag für den Ablauf des folgenden Tages;

          2. wenn die Vergütung nach Wochen bemessen ist, spätestens am ersten Werktag einer Woche für
          den Ablauf des folgenden Sonnabends;

          3. wenn die Vergütung nach Monaten bemessen ist, spätestens am 15. eines Monats für den Schluss
          des Kalendermonats;

          4. wenn die Vergütung nach Vierteljahren oder längeren Zeitabschnitten bemessen ist, unter Einhaltung
          einer Kündigungsfrist von sechs Wochen für den Schluss eines Kalendervierteljahrs;

          5. wenn die Vergütung nicht nach Zeitabschnitten bemessen ist, jederzeit; bei einem die Erwerbstätigkeit
          des Verpflichteten vollständig oder hauptsächlich in Anspruch nehmenden Dienstverhältnis ist
          jedoch eine Kündigungsfrist von zwei Wochen einzuhalten.'
        used_in_prompt: true
      - chunk_id: gii-bgb-620#0
        doc_id: gii-bgb-620
        rank: 2
        score: 0.5
        tenant_id: shared_public
        text: '(1) Das Dienstverhältnis endigt mit dem Ablauf der Zeit, für die es eingegangen ist.

          (2) Ist die Dauer des Dienstverhältnisses weder bestimmt noch aus der Beschaffenheit oder dem
          Zwecke der Dienste zu entnehmen, so kann jeder Teil das Dienstverhältnis nach Maßgabe der §§
          621 bis 623 kündigen.

          (3) Für Arbeitsverträge, die auf bestimmte Zeit abgeschlossen werden, gilt das Teilzeit- und
          Befristungsgesetz.

          (4) Ein Verbrauchervertrag über eine digitale Dienstleistung kann auch nach Maßgabe der §§ 327c,
          327m und 327r Absatz 3 und 4 beendet werden.'
        used_in_prompt: true
      - chunk_id: gii-bgb-626#0
        doc_id: gii-bgb-626
        rank: 3
        score: 0.45
        tenant_id: shared_public
        text: '(1) Das Dienstverhältnis kann von jedem Vertragsteil aus wichtigem Grund ohne Einhaltung
          einer Kündigungsfrist gekündigt werden, wenn Tatsachen vorliegen, auf Grund derer dem Kündigenden
          unter Berücksichtigung aller Umstände des Einzelfalles und unter Abwägung der Interessen beider
