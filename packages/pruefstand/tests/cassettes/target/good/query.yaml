    tenant_id: kanzlei_mueller
  response:
    body:
      answer: Die Arbeitnehmer kann unter dem Vorbehalt annehmen, daß die Änderung der Arbeitsbedingungen
        nicht sozial ungerechtfertigt ist.
      chunks:
