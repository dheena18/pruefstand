- request:
    question: Wann ist die Kündigung eines Arbeitnehmers nach dem Kündigungsschutzgesetz rechtsunwirksam?
    tenant_id: kanzlei_mueller
  response:
    body:
      answer: § 1 KSchG
      chunks:
      - chunk_id: gii-kschg-1#0
        doc_id: gii-kschg-1
        rank: 1
        score: 0.6666667
        tenant_id: kanzlei_mueller
        text: (1) Die Kündigung des Arbeitsverhältnisses gegenüber einem Arbeitnehmer, dessen Arbeitsverhältnis
          in demselben Betrieb oder Unternehmen ohne Unterbrechung länger als sechs Monate bestanden hat,
          ist rechtsunwirksam, wenn sie sozial ungerechtfertigt ist.
        used_in_prompt: true
      - chunk_id: gii-kschg-1#1
        doc_id: gii-kschg-1
        rank: 2
        score: 0.625
        tenant_id: kanzlei_mueller
        text: '(2) Sozial ungerechtfertigt ist die Kündigung, wenn sie nicht durch Gründe, die in der
          Person oder in dem Verhalten des Arbeitnehmers liegen, oder durch dringende betriebliche Erfordernisse,
          die einer Weiterbeschäftigung des Arbeitnehmers in diesem Betrieb entgegenstehen, bedingt ist.
          Die Kündigung ist auch sozial ungerechtfertigt, wenn

          1. in Betrieben des privaten Rechts

          a) die Kündigung gegen eine Richtlinie nach § 95 des Betriebsverfassungsgesetzes verstößt,

          b) der Arbeitnehmer an einem anderen Arbeitsplatz in demselben Betrieb oder in einem anderen
          Betrieb des Unternehmens weiterbeschäftigt werden kann

          und der Betriebsrat oder eine andere nach dem Betriebsverfassungsgesetz insoweit zuständige
          Vertretung der Arbeitnehmer aus einem dieser Gründe der Kündigung innerhalb der Frist des §
          102 Abs. 2 Satz 1 des Betriebsverfassungsgesetzes schriftlich widersprochen hat,

          2. in Betrieben und Verwaltungen des öffentlichen Rechts

          a) die Kündigung gegen eine Richtlinie über die personelle Auswahl bei Kündigungen verstößt,

          b) der Arbeitnehmer an einem anderen Arbeitsplatz in derselben Dienststelle oder in einer anderen
          Dienststelle desselben Verwaltungszweigs an demselben Dienstort einschließlich seines Einzugsgebiets
          weiterbeschäftigt werden kann

          und die zuständige Personalvertretung aus einem dieser Gründe fristgerecht gegen die Kündigung
          Einwendungen erhoben hat, es sei denn, daß die Stufenvertretung in der Verhandlung mit der übergeordneten
          Dienststelle die Einwendungen nicht aufrechterhalten hat.

          Satz 2 gilt entsprechend, wenn die Weiterbeschäftigung des Arbeitnehmers nach zumutbaren Umschulungs-
          oder Fortbildungsmaßnahmen oder eine Weiterbeschäftigung des Arbeitnehmers unter geänderten
          Arbeitsbedingungen möglich ist und der Arbeitnehmer sein Einverständnis hiermit erklärt hat.
          Der Arbeitgeber hat die Tatsachen zu beweisen, die die Kündigung bedingen.'
        used_in_prompt: true
      - chunk_id: gii-kschg-4#0
        doc_id: gii-kschg-4
        rank: 3
        score: 0.5833334
        tenant_id: kanzlei_mueller
        text: Will ein Arbeitnehmer geltend machen, dass eine Kündigung sozial ungerechtfertigt oder aus
          anderen Gründen rechtsunwirksam ist, so muss er innerhalb von drei Wochen nach Zugang der schriftlichen
          Kündigung Klage beim Arbeitsgericht auf Feststellung erheben, dass das Arbeitsverhältnis durch
          die Kündigung nicht aufgelöst ist. Im Falle des § 2 ist die Klage auf Feststellung zu erheben,
          daß die Änderung der Arbeitsbedingungen sozial ungerechtfertigt oder aus anderen Gründen rechtsunwirksam
          ist. Hat der Arbeitnehmer Einspruch beim Betriebsrat eingelegt (§ 3), so soll er der Klage die
          Stellungnahme des Betriebsrats beifügen. Soweit die Kündigung der Zustimmung einer Behörde bedarf,
          läuft die Frist zur Anrufung des Arbeitsgerichts erst von der Bekanntgabe der Entscheidung der
