        tenant_id: kanzlei_mueller
        text: Kündigt der Arbeitgeber das Arbeitsverhältnis und bietet er dem Arbeitnehmer im Zusammenhang
          mit der Kündigung die Fortsetzung des Arbeitsverhältnisses zu geänderten Arbeitsbedingungen
          an, so kann der Arbeitnehmer dieses Angebot unter dem Vorbehalt annehmen, daß die Änderung der
          Arbeitsbedingungen nicht sozial ungerechtfertigt ist (§ 1 Abs. 2 Satz 1 bis 3, Abs. 3 Satz 1
          und 2). Diesen Vorbehalt muß der Arbeitnehmer dem Arbeitgeber innerhalb der Kündigungsfrist,
          spätestens jedoch innerhalb von drei Wochen nach Zugang der Kündigung erklären.
