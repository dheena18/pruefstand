[project]
name = "pruefstand"
version = "0.0.1"
description = "Open-source release gate for German-language RAG"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings",
  "typer",
  "structlog",
  "pyyaml",
  "numpy",
  "polars",
  "httpx",
  "jinja2",
  "lxml>=5.3",
]

[project.scripts]
pruefstand = "pruefstand.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pruefstand"]
