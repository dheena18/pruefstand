[project]
name = "rag-demo"
version = "0.0.1"
description = "Reference German RAG app: the system under test of Prüfstand (never imports pruefstand)"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic>=2.7",
  "pydantic-settings",
  "pyyaml",
  "numpy",
  "xxhash>=4.0.2",
  "snowballstemmer>=3.1.1",
  # T3.4: `rag-demo index` (Typer), the per-line schema check, and the embedding model's tokenizer.json (D241).
  "typer",
  "jsonschema",
  "tokenizers>=0.21",
]

[project.scripts]
rag-demo = "rag_demo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_demo"]
