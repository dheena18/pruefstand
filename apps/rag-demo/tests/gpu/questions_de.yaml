# T3.7 (milestone M2): the 10 hand-written quality questions for the tier-2 stack (slice corpus, real models).
# Each has the tenant that asks, the expected norm citation(s) (any of them counts; checked in the response's
# `citations` only) and key facts (any of them, as whole words after the suite's normalisation: casefold,
# German number words as digits). `lang` is the question's language; the answer must be recognisably in it.
# The human verdict (S4) is recorded in report.md, never here.
questions:
  - id: q01
    tenant: kanzlei_mueller
    lang: de
    question: Welche Kündigungsfrist gilt für den Arbeitgeber, wenn das Arbeitsverhältnis zwei Jahre bestanden hat?
    citation: ["§ 622 BGB"]
    key_facts: ["einen monat", "ein monat", "1 monat"]
  - id: q02
    tenant: kanzlei_mueller
    lang: de
    question: Wie viele Stunden darf die werktägliche Arbeitszeit höchstens betragen?
    citation: ["§ 3 ArbZG"]
    key_facts: ["8 stunden", "10 stunden"]
  - id: q03
    tenant: kanzlei_mueller
    lang: de
    question: Wann ist eine Kündigung sozial ungerechtfertigt?
    citation: ["§ 1 KSchG"]
    key_facts: ["person", "verhalten", "dringende betriebliche erfordernisse"]
