# Public demo profile (T8.4, ADR-0012): the tier-1 CPU profile plus public mode. reranker off (no
# rerank service in the demo, UI11-16). The limits below are the defaults; the DEMO_* environment
# variables override them per deployment. The test-only reset route is never enabled here.
generator:
  model: qwen2.5-0.5b-instruct-q4_k_m
  family: qwen
  enable_thinking: false
  api_key_env: PRUEFSTAND_CANDIDATE_API_KEY
  temperature: 0.0
  seed: 0
embed:
  model: intfloat/multilingual-e5-small
  query_prefix: "query: "
  doc_prefix: "passage: "
  max_input_tokens: 512
  dim: 384
  api_key_env: PRUEFSTAND_CANDIDATE_API_KEY
top_k: 4
chunk_prompt_tokens: 256
max_tokens: 256
reranker: "off"
tenant_filter: inside
shared_public_merge: filtered
prompt_file: prompts/answer_de_v1.txt
answer_language: auto
injection_guard: "on"
system_prompt_guard: "on"
public_mode: true
public:
  rate_per_min: 10
  daily_per_key: 100
  daily_requests: 2000
  daily_tokens: 200000
  max_concurrency: 2
  timeout_s: 75
