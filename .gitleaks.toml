# Narrow allowlist for the Pruefstand secret scan (T0.2). Never add a broad path or rule here.
[extend]
useDefault = true

[[allowlists]]
description = "Review prose names the Ollama setting OLLAMA_KEEP_ALIVE=-1 (a config value, not a credential)"
condition = "AND"
paths = [
  '''docs/planning/reviews/round12-ai\.md''',
]
regexes = [
  '''OLLAMA_KEEP_ALIVE=-1''',
]

[[allowlists]]
description = "T1.4 scrub test: a made-up AWS-shaped string that assert_no_secrets must refuse (history of commit af85041)"
condition = "AND"
paths = [
  '''packages/pruefstand/tests/unit/llm/test_scrub\.py''',
]
regexes = [
  '''AKIAABCDEFGHIJKLMNOP''',
]

[[allowlists]]
description = "T1.13 slice corpus: the planted token canaries CANARY-KM-/CANARY-VN- are synthetic test data (CLAUDE.md section 9), not credentials; only these literals in the slice sources, the committed slice and its test"
condition = "AND"
paths = [
  '''scripts/slice/handwritten/''',
  '''scripts/slice/tests/''',
  '''corpus/slice_v1/''',
]
regexes = [
  '''CANARY-(KM|VN)-[0-9a-f]{6}''',
]

[[allowlists]]
description = "T1.9 report canary-masking tests: a synthetic canary token assigned to a variable named TOKEN in an early commit (CLAUDE.md section 9: canary tokens are test data, not credentials)"
condition = "AND"
paths = [
  '''packages/pruefstand/tests/unit/report/test_canary\.py''',
]
regexes = [
  '''CANARY-VN-7f3a9c''',
]

[[allowlists]]
description = "T5.1 policy-guard test: a synthetic canary token assigned to a variable named TOKEN (CLAUDE.md section 9: canary tokens are test data, not credentials)"
condition = "AND"
paths = [
  '''packages/pruefstand/tests/unit/llm/test_policy_guard\.py''',
]
regexes = [
  '''CANARY-VN-7f3a9c''',
]

[[allowlists]]
description = "T2.6 validator test: one synthetic canary token assigned to an argument named token (CLAUDE.md section 9: test data, not a credential)"
condition = "AND"
paths = [
  '''^scripts/tests/test_validate_canaries\.py$''',
]
regexes = [
  '''CANARY-VN-7f3a9c''',
]

[[allowlists]]
description = "T3.1e log-tail redaction test: a made-up key=value secret that the redaction must mask (synthetic sample, not a credential)"
condition = "AND"
paths = [
  '''infra/cluster/tests/test_cluster_log_tail\.py''',
]
regexes = [
  '''Zq9Xk2LmN4pR7sT1vW3y''',
]
