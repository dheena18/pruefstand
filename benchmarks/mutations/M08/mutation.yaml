id: M08
title: Tenant filter applied after retrieval with the top-k cut
kind: config
rag_overrides: {tenant_filter: post_topk}
needs_reindex: false
cache_invalidating: true
tier: pr
splits: [smoke, core, robust_pr]
stratum: deterministic
tier1: true
in_detection_rate: true
expected:
  status: FAIL
