name: demo-ready

# Marks a release as demo-ready (T8.5 S6, UI13-06, X2.8, ADR-0012, security.md D2): after a successful TAG release it
# verifies the rag-demo image of the release (cosign, release identity), probes it for leaks on a hosted runner and
# then uploads the release asset `demo-ready.json` {tag, digest, release_run_id}. The private `demo-nightly.yml`
# deploys only a release that carries this asset. A leak skips the last job, so the release has no mark; the VM keeps
# its previous digest. A failure here fails only this run, never a dashboard refresh or the release itself.
# Runs main's code only (workflow_run runs the default branch's workflow); no secret is used.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] mandated by D318: provenance check first, only main code, no secrets
    workflows: [release]  # the `name:` of release.yml (T9.1a must keep it)
    types: [completed]

permissions: {}

concurrency:
  group: demo-ready
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dheena18/rag-demo

jobs:
  fetch-artefacts:
    # A tag release only: an RC dispatch is never marked.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # downloads the triggering release.yml run's artefact (D301)
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the rag-demo digest of the tag
        id: verify
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          # image-digests.json: {"<image>": {"<tag>": "sha256:<digest>"}} (T9.1a, ci-cd.md)
          digest="$(jq -r --arg tag "$TAG" '."rag-demo"[$tag] // empty' image-digests.json)"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "no rag-demo digest for $TAG" >&2; exit 1; }
          cosign verify "$IMAGE@$digest" \
            --certificate-identity "https://github.com/dheena18/pruefstand/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "verified $TAG $digest" >> "$GITHUB_STEP_SUMMARY"

  pre-deploy-leak-probes:
    needs: fetch-artefacts
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DIGEST: ${{ needs.fetch-artefacts.outputs.digest }}
      COMPOSE_PROJECT_NAME: pruefstand-demo-probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages --all-extras
      - name: Model files
        run: |
          for manifest in infra/models/*.yaml; do
            uv run python scripts/models/fetch.py --manifest "$manifest"
          done
      - name: Start the demo profile with the verified image (no cloudflared)
        env:
          PROBE_IMAGE_REF: ghcr.io/dheena18/rag-demo
        run: |
          export PROBE_IMAGE="$PROBE_IMAGE_REF@$DIGEST"
          docker compose -f infra/deploy/demo/compose.yml -f infra/deploy/demo/compose.probe.yml \
            --profile demo up -d --wait --no-build
      - name: Build the probe set and run it
        run: |
          set -euo pipefail
          version="$(jq -r .corpus_version corpus/slice_v1/manifest.json)"
          uv run python scripts/deploy/build_leak_probe_set.py --out leakprobe-set --corpus-version "$version"
          uv run pruefstand run --config infra/deploy/leakprobe.pruefstand.yaml --tier pr --out runs/
      - name: Judge the probe run
        run: |
          set -euo pipefail
          run_dir="$(find runs -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          uv run python scripts/deploy/check_leak_probes.py "$run_dir" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: always()
        run: docker compose -f infra/deploy/demo/compose.yml -f infra/deploy/demo/compose.probe.yml --profile demo logs --tail=200
      - name: Down
        if: always()
        run: docker compose -f infra/deploy/demo/compose.yml -f infra/deploy/demo/compose.probe.yml --profile demo down -v --remove-orphans

  release-demo-ready:
    needs: [fetch-artefacts, pre-deploy-leak-probes]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # uploads the demo-ready.json release asset (D318); no checkout, no repository code, no image
    steps:
      - name: Upload demo-ready.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.fetch-artefacts.outputs.tag }}
          DIGEST: ${{ needs.fetch-artefacts.outputs.digest }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" --arg digest "$DIGEST" --argjson run "$RELEASE_RUN_ID" \
            '{tag: $tag, digest: $digest, release_run_id: $run}' > demo-ready.json
          gh release upload "$TAG" demo-ready.json -R "$GITHUB_REPOSITORY"
          echo "demo-ready: $TAG $DIGEST" >> "$GITHUB_STEP_SUMMARY"
