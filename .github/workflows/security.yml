name: security

# Supply-chain and secret scanning on hosted runners (docs/engineering/ci-cd.md section 1.1).
# Required check: `security / scan` (the aggregate job). `scorecard` runs on the weekly cron only.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    # Needs GitHub Advanced Security on a private repo: runs only while the repo is public.
    # Dependabot and fork PRs get a read-only token that cannot upload SARIF: skip there (the
    # `scan` aggregate tolerates exactly this skip).
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python  # javascript-typescript is added by T8.1
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Pull requests scan only their own commit range (D853): a synthetic secret-looking test string on another
      # branch must not fail every PR. Push to main and the weekly run scan the full history. No allowlist is widened.
      - name: Scan the PR commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # An unreachable range would scan 0 commits and pass silently: fail instead.
          git rev-parse --verify --quiet "${BASE_SHA}^{commit}" > /dev/null
          git rev-parse --verify --quiet "${HEAD_SHA}^{commit}" > /dev/null
          [ "$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")" -gt 0 ]
          ./gitleaks git --verbose --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --verbose --redact --no-banner --exit-code 1 .

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --all-packages --all-extras > audit-requirements.txt
          uvx pip-audit@2.10.1 --no-deps --disable-pip --strict -r audit-requirements.txt

  pnpm-audit:
    name: pnpm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the dashboard's production dependencies
        run: |
          if [ ! -f apps/dashboard/package.json ]; then
            echo "pnpm-audit: apps/dashboard does not exist yet (T8.1), nothing to audit"
            exit 0
          fi
          corepack enable
          (cd apps/dashboard && pnpm audit --prod)

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: zizmor
        run: uvx zizmor@1.31.1 --min-severity medium .github/workflows
      - name: Install actionlint (pinned release, SHA-256 checked)
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: Dependency review
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # ONE advisory, owner decision 2026-11-03 (tracking issue #79). No wildcard, no severity downgrade, no
          # blanket dev-dependency exemption. GHSA-g3hv-75wg-m249 = minimatch (moderate, DoS via globparts
          # amplification). Dev tooling only: eslint 9 / typescript-eslint -> minimatch in apps/dashboard; it is never
          # in the built dashboard and never at runtime (`pnpm audit --prod` is clean). The patched minimatch 11
          # breaks eslint's config loader. REMOVE this line once eslint/typescript-eslint ship a patched minimatch
          # (see issue #79 for the removal steps).
          allow-ghsas: GHSA-g3hv-75wg-m249

  scorecard:
    name: scorecard
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard

  scan:
    name: scan
    if: always()
    needs:
      - codeql
      - gitleaks
      - pip-audit
      - pnpm-audit
      - zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every scan succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # codeql may be skipped (Dependabot and fork PRs); every other job must be a success
          echo "$NEEDS" | jq -e 'to_entries | all(.[]; .value.result == "success" or (.key == "codeql" and .value.result == "skipped"))' > /dev/null
