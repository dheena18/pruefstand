name: ui

# Dashboard (ci-cd.md section 1.1, ui-spec 14.3): hosted runners only, no secrets, no path filters (every job
# here is part of the required check `ui-check` (D647)). T8.3 adds `playwright` and `basepath-smoke` to the aggregate.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-lint:
    name: ui-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: lint
        run: (cd apps/dashboard && pnpm lint)

  ui-typecheck:
    name: ui-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: typecheck
        run: (cd apps/dashboard && pnpm typecheck)

  ui-unit:
    name: ui-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: Build both fixture sets
        run: |
          scripts/dashboard/build_set.sh populated
          scripts/dashboard/build_set.sh empty
      - name: Vitest with coverage (src/lib >= 80 %)
        env:
          DASHBOARD_SETS_PREBUILT: "1"
        run: (cd apps/dashboard && pnpm test:coverage)

  types-fresh:
    name: types-fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: Regenerate types, licences and report tokens
        run: |
          (cd apps/dashboard && pnpm gen:types)
          (cd apps/dashboard && pnpm gen:licences)
          (cd apps/dashboard && pnpm gen:report-tokens)
      - name: No drift
        run: |
          git diff --exit-code -- \
            apps/dashboard/src/types/generated apps/dashboard/src/content \
            packages/pruefstand/src/pruefstand/report/templates/_tokens.css \
            packages/pruefstand/src/pruefstand/report/templates/_licences.json

  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install
        run: |
          corepack enable
          (cd apps/dashboard && pnpm install --frozen-lockfile)
          uv sync --frozen --all-packages --all-extras
      - name: Both sets pass validate_data.mjs
        run: |
          node scripts/dashboard/validate_data.mjs apps/dashboard/fixtures/populated
          node scripts/dashboard/validate_data.mjs apps/dashboard/fixtures/empty
      - name: State coverage (ui-spec 14.1)
        run: node scripts/dashboard/check_fixture_states.mjs
      - name: derive.py is reproducible
        run: |
          uv run python scripts/dashboard/derive.py
          git diff --exit-code -- apps/dashboard/fixtures/raw
      - name: SOURCE.md is at most 30 days old (informational until M7)
        continue-on-error: true
        run: |
          date_line="$(sed -n 's/^Date: //p' apps/dashboard/fixtures/populated/SOURCE.md | head -n 1)"
          age=$(( ( $(date +%s) - $(date -d "$date_line" +%s) ) / 86400 ))
          echo "fixture snapshot is $age days old"
          test "$age" -le 30

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: Build both sets
        run: |
          scripts/dashboard/build_set.sh populated
          scripts/dashboard/build_set.sh empty

  playwright:
    name: playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: Install Chromium (Playwright 1.49.1)
        run: (cd apps/dashboard && pnpm exec playwright install --with-deps chromium)
      - name: Build both fixture sets
        run: |
          scripts/dashboard/build_set.sh populated
          scripts/dashboard/build_set.sh empty
      - name: PR projects (populated and empty, 360 and 1280), assertions, axe and CSP
        run: (cd apps/dashboard && pnpm exec playwright test)
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7

  basepath-smoke:
    name: basepath-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: corepack enable && (cd apps/dashboard && pnpm install --frozen-lockfile)
      - name: Install Chromium (Playwright 1.49.1)
        run: (cd apps/dashboard && pnpm exec playwright install --with-deps chromium)
      - name: Build with basePath=/pruefstand, serve under /pruefstand/, run the smoke (N5.5)
        run: make ui-basepath
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: basepath-smoke-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7

  check:
    name: ui-check
    if: always()
    needs: [ui-lint, ui-typecheck, ui-unit, types-fresh, fixtures, build, playwright, basepath-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
