# Image checks (T0.3, docs/engineering/ci-cd.md section 1): hadolint, compose validation and lint, a smoke
# build of the Dockerfile template and a Trivy scan. Nothing is pushed here (push + cosign: T6.2b).
# Every checkout uses the PR HEAD sha, never the refs/pull/N/merge commit (X2.4), so the image label
# org.opencontainers.image.revision is the head SHA the executor later verifies.
name: build-images

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: build-images-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # hadolint/hadolint:v2.12.0-alpine, pinned by digest
  HADOLINT_IMAGE: hadolint/hadolint@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199

jobs:
  changes:
    # Early exit (no path filters on the trigger, so the required aggregate check always reports): the other
    # jobs run only when a Dockerfile or compose file changed, or on main.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "push to main: running all image checks"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -E \
            '(^|/)(Dockerfile[^/]*|[^/]*\.Dockerfile|docker-compose[^/]*\.ya?ml|compose[^/]*\.ya?ml)$|^\.hadolint\.yaml$|^\.dockerignore$|^scripts/check_compose\.py$|^pyproject\.toml$|^uv\.lock$|^(packages|apps)/.*pyproject\.toml$|^\.github/workflows/build-images\.yml$' || true)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Docker-related files changed:"; echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No Dockerfile or compose file changed and not main: image checks skipped."
          fi

  hadolint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: hadolint all Dockerfiles
        run: |
          mapfile -t files < <(git ls-files 'Dockerfile*' '**/Dockerfile*' '*.Dockerfile' '**/*.Dockerfile')
          [ "${#files[@]}" -gt 0 ] || { echo "no Dockerfiles"; exit 0; }
          printf 'hadolint: %s\n' "${files[@]}"
          docker run --rm -v "$PWD:/work:ro" -w /work "$HADOLINT_IMAGE" \
            hadolint --config .hadolint.yaml "${files[@]}"

  build-image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build pruefstand-smoke (template, PKG=pruefstand), no push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/python-uv.Dockerfile
          build-args: |
            PKG=pruefstand
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          load: true
          push: false
          tags: pruefstand-smoke
          cache-from: type=gha,scope=pruefstand-smoke
          cache-to: type=gha,scope=pruefstand-smoke,mode=min,ignore-error=true
      - name: Smoke test
        run: docker run --rm pruefstand-smoke --help

  trivy:
    needs: [changes, build-image]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build pruefstand-smoke (layers from the build-image cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/python-uv.Dockerfile
          build-args: |
            PKG=pruefstand
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          load: true
          push: false
          tags: pruefstand-smoke
          cache-from: type=gha,scope=pruefstand-smoke
      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pins setup-trivy 3fb12ec = v0.2.6)
        with:
          image-ref: pruefstand-smoke
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
      - name: Trivy gate (HIGH/CRITICAL with a fix available fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pins setup-trivy 3fb12ec = v0.2.6)
        with:
          image-ref: pruefstand-smoke
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Code scanning needs a public repo or GitHub Advanced Security: skipped while the repo is private (D-T0.3,
      # revisit when the repo goes public). Same-repo, non-Dependabot runs only (their tokens are read-only). always(): the SARIF is
      # uploaded even when the gate above fails; the gate, not the upload, decides the job.
      - name: Upload SARIF (public repo, same-repo runs only)
        if: >-
          always() && github.event.repository.private == false &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: trivy-image.sarif
          category: trivy-pruefstand-smoke

  compose-config:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: docker compose config -q for all profiles
        run: docker compose --profile core --profile live --profile dev config -q

  compose-lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: scripts/check_compose.py (PyYAML pinned to the version in uv.lock)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --no-deps "pyyaml==6.0.3"
          "$RUNNER_TEMP/lint/bin/python" scripts/check_compose.py

  images-gate:
    name: images-gate
    # Aggregator = the required check `images-gate` (T0.2 pattern).
    needs: [changes, hadolint, build-image, trivy, compose-config, compose-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All image checks succeeded (or were skipped by the early exit)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "results: $RESULTS"
          [ "$CHANGES" = "success" ] || { echo "changes job: $CHANGES"; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "failed: $r"; exit 1 ;; esac
          done
