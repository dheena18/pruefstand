# gate-router.yml (T6.2b S1b; X2.2, round 13 P1.1/P4.2, D1088). OWNER-MERGE.
# The only pull_request_target workflow: it never checks out or runs PR code. It reads the PR's changed files from
# the REST API and posts the required status `pruefstand/gate` with a short-lived `pruefstand-bot` App token
# (environment `gate-router`, deployment branch main only; the ruleset accepts `pruefstand/gate` only from that App):
#   no gated path changed                          -> success "not gated (no gated paths changed)"
#   release-please PR, only release-exempt lines   -> success "not gated (release version bump)"
#   anything else (gated), or a file list that is incomplete or belongs to another SHA (fail closed)
#                                                  -> pending "gated: awaiting tier-2 dispatch"; it replaces a
#                                                     "not gated" success but never the executor's result
# GATED_RE and RELEASE_RULES are generated by scripts/ci/gate_router_regex.py from gated_paths.txt and ci-cd.md
# section 5; scripts/ci/tests/test_gate_router.py keeps them equal. PR title, body and branch name are never
# interpolated into a shell or a script (they are read from the event payload inside the script).
name: gate-router

on:
  # zizmor: ignore[dangerous-triggers] the documented single exception (X2.2): no checkout, no PR code, API only
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: gate-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gate-router
    permissions:
      pull-requests: read
    steps:
      - name: Classify the changed files
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATED_RE: '^(?:apps/rag\-demo/.+|uv\.lock|pyproject\.toml|infra/docker/.+|infra/gpu/.+|packages/pruefstand/src/pruefstand/gate/.+|packages/pruefstand/src/pruefstand/metrics/.+|packages/pruefstand/src/pruefstand/judges/.+|packages/pruefstand/src/pruefstand/runner/.+|datasets/.+)$'
          RELEASE_RULES: '[{"file":"^(?:.+/)?pyproject\\.toml$","line":"^version = \"[^\"]+\"$"},{"file":"^\\.release-please-manifest\\.json$","line":"^\\s*\"[^\"]+\": \"[^\"]+\",?$"},{"file":"^action/action\\.yml$","line":"^\\s*image: \\S+$"},{"file":"^CHANGELOG\\.md$","line":"^.*$"},{"file":"^uv\\.lock$","line":"^version = \"[^\"]+\"$","after_name":["pruefstand","rag-demo"]}]'
        with:
          script: |
            const gated = new RegExp(process.env.GATED_RE);
            const rules = JSON.parse(process.env.RELEASE_RULES);
            const pr = context.payload.pull_request;
            const eventSha = pr.head.sha;
            const current = async () =>
              (await github.rest.pulls.get({ ...context.repo, pull_number: pr.number })).data;
            const before = await current();
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const after = await current();
            // D1088: the file list must be complete and belong to the event SHA, else fail closed
            const complete = files.length < 3000 && files.length === before.changed_files;
            const stable = before.head.sha === eventSha && after.head.sha === eventSha;
            const NAME = /^name = "([^"]+)"$/;
            function lineExempt(patch, rule) {
              const lineRe = new RegExp(rule.line);
              let current = '';
              for (const raw of patch.split('\n')) {
                if (raw.startsWith('+++') || raw.startsWith('---') || raw.startsWith('@@')) continue;
                const body = raw.slice(1);
                const found = NAME.exec(body);
                if (found) current = found[1];
                if (raw[0] !== '+' && raw[0] !== '-') continue;
                if (!lineRe.test(body)) return false;
                if (Array.isArray(rule.after_name) && !rule.after_name.includes(current)) return false;
              }
              return true;
            }
            function fileExempt(f) {
              if (typeof f.patch !== 'string' || f.previous_filename) return false;
              const rule = rules.find((r) => new RegExp(r.file).test(f.filename));
              return rule !== undefined && lineExempt(f.patch, rule);
            }
            let state = 'pending';
            let description = 'gated: awaiting tier-2 dispatch';
            const touchesGated = (f) =>
              gated.test(f.filename) || (typeof f.previous_filename === 'string' && gated.test(f.previous_filename));
            if (!complete || !stable) {
              core.info('file list incomplete or the head moved: treated as gated');
            } else if (!files.some(touchesGated)) {
              state = 'success';
              description = 'not gated (no gated paths changed)';
            } else if (
              pr.user.login === 'pruefstand-release[bot]' &&
              pr.head.ref.startsWith('release-please--') &&
              files.length > 0 &&
              files.every(fileExempt)
            ) {
              state = 'success';
              description = 'not gated (release version bump)';
            }
            core.setOutput('state', state);
            core.setOutput('description', description);
      - name: Mint the pruefstand-bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          permission-statuses: write
      - name: Post pruefstand/gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATE: ${{ steps.classify.outputs.state }}
          DESCRIPTION: ${{ steps.classify.outputs.description }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const sha = context.payload.pull_request.head.sha;
            const state = process.env.STATE;
            if (state === 'pending') {
              const combined = await github.rest.repos.getCombinedStatusForRef({ ...context.repo, ref: sha });
              const current = combined.data.statuses.find((s) => s.context === 'pruefstand/gate');
              // never replace the executor's result; a stale "not gated" success is replaced (D1088)
              if (current && current.state !== 'pending' && !current.description.startsWith('not gated')) {
                core.info(`pruefstand/gate is already ${current.state} on ${sha}; not overwritten`);
                return;
              }
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha,
              state,
              context: 'pruefstand/gate',
              description: process.env.DESCRIPTION,
            });
