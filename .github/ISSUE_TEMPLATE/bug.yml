name: Bug report
description: Something in Prüfstand does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config and dataset split. A failing test is ideal (every bug fix starts with one).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true
