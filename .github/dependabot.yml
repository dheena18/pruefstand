# Weekly, ONE group per ecosystem (uv, npm, github-actions, docker; D856) so each ecosystem produces at most one PR. PR titles stay Conventional Commits
# (`chore(deps): ...`) so the `commitlint` job passes. Entries for directories that do not exist yet are harmless.
# Every ecosystem waits 5 days after a release before proposing it (`cooldown`, review F6, D1121).
# Docker Compose support: Dependabot ecosystem `docker-compose` (verified 2026-10-31); it joins the group name `docker`.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node 22 LTS: stay on @types/node 22 (owner decision 2026-11-09, D856).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next 16 migration not planned yet: keep next and eslint-config-next on major 15.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Toolchain majors (typescript 7, eslint 10, vitest 5) break ui-unit; take them in a dedicated task.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The composite actions under .github/actions/ pin their own actions (review F6, D1121).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /apps/rag-demo
      - /action
      - /infra/gpu/rerank
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Python base stays on 3.12-slim-bookworm (project pins Python 3.12).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directories:
      - /
      - /infra/gpu
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
