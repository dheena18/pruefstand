# Model catalogue of the ONE Ollama server (T3.1a; docs/engineering/gpu-cluster.md section 2, interfaces 1.5).
# Validated by catalogue_schema.py (test_catalogue.py). Every value is PROVISIONAL until T3.1b pins it.
# id = ollama/<tag> for engine ollama (configs and endpoints.yaml use the id; the bare tag appears only in
# Ollama API bodies). digest = sha256 of the registry manifest (the pin; tags are mutable). disk_bytes = manifest
# config + layers (the number /api/tags reports as size). `standard: true` = the day/night set; the other
# entries are swap candidates (swap rule, ADR-0019). options feed every preload (switch-mode.sh, health.sh
# --repair) and every trusted request, num_ctx fixed per model. kv_bytes_per_token are planning values at
# OLLAMA_KV_CACHE_TYPE=q8_0 (verify with the load log in S8). Digests, sizes and tokenizer hashes were read from
# registry.ollama.ai and huggingface.co on 2026-11-02.
