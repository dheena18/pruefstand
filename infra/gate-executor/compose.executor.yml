# Executor stack on the VM (T6.2a; project name pruefstand-exec, started by the orchestrator as user pruefstand).
# qdrant + rerank-cpu (S4, D1089) and llm-proxy (S4b). The candidate container (started by the orchestrator with
# `docker run`, never from this file) joins only the internal network gate-net and reaches the three by name.
# Only qdrant publishes host ports, on loopback with the executor's default ports (the owner's dev stack uses
# PORT_OFFSET=10000, Y1.4/D214); rerank-cpu and llm-proxy publish none (D242).
name: pruefstand-exec

services:
  qdrant:
    # Same image and digest as the root docker-compose.yml (decisions "Pinned versions"); a test keeps them equal.
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    # gate-net: the candidate reads it by name; exec-host: a plain bridge, needed only so the loopback port
    # (the trusted orchestrator and `pruefstand run` on the VM) can be published: Docker publishes no port of a
    # container that is on internal networks only.
    # exec-host gives qdrant itself egress; only snapshot recover-from-URL uses it, a write op that needs the
    # read-write key the candidate never gets (security.md C2, D1098).
    networks: [gate-net, exec-host]
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      # Read-write key for the trusted orchestrator; the candidate gets only the read-only key, passed to it as
      # QDRANT_API_KEY (D1098), so it can never wipe or poison chunks_active. Both from runner.env, both required.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in runner.env (the executor's Qdrant admin key)}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in runner.env}
    volumes:
      # $PRUEFSTAND_HOME/qdrant on the VM disk, never the data root (prompt "Constraints")
      - ${PRUEFSTAND_HOME:?set PRUEFSTAND_HOME (runner.env)}/qdrant:/qdrant/storage
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    healthcheck:
      # The image has neither curl nor wget: plain HTTP over bash's /dev/tcp (/readyz needs no key).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
          && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          && grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  rerank-cpu:
    # The T3.1a service, executor variant: internal only, no host port, weights read-only and offline (gate-net has
    # no egress). The weights volume is filled once by the owner (runbook §0, `pruefstand-rerank-models`).
    build:
      context: ../gpu/rerank
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    networks: [gate-net]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - rerank_models:/models:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 8g
    cpus: ${RERANK_CPUS:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8201/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  llm-proxy:
    build:
      context: ./llm-proxy
    # A normal container, never network_mode: host (D242). gate-net: the candidate reaches it as
    # http://llm-proxy:11500; proxy-egress: its only way out, to LLM_PROXY_UPSTREAM (the tunnel on 172.17.0.1).
    networks: [gate-net, proxy-egress]
    environment:
      PRUEFSTAND_CANDIDATE_API_KEY: ${PRUEFSTAND_CANDIDATE_API_KEY:?set by the orchestrator from runner.env}
      LLM_PROXY_POLICY: ${LLM_PROXY_POLICY:?written by the orchestrator from infra/gpu/models.yaml}
      LLM_PROXY_UPSTREAM: http://172.17.0.1:11434
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    pids_limit: 128      # D1072: bounded threads per proxy
    mem_limit: 256m
    labels:
      pruefstand.job: "llm-proxy"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:11500/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: "no"

networks:
  gate-net:
    name: gate-net
    internal: true
  exec-host:
    # plain bridge for qdrant's loopback port only; no candidate is ever attached to it
    name: pruefstand-exec-host
  proxy-egress:
    # created by T0.7 (subnet 10.231.0.0/24) so the VM firewall can name it; never attach the candidate to it
    external: true

volumes:
  rerank_models:
    # filled once by the owner with the pinned bge-reranker-v2-m3 weights (runbook §0); read-only here
    external: true
    name: pruefstand-rerank-models
