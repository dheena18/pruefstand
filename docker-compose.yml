# Prüfstand compose stack (T0.3; docs/engineering/docker.md section 3 is the port table).
# Profiles: core (Qdrant) | live (CPU stack of tier 1: Qdrant + llama.cpp + TEI embeddings + rag-demo) |
# dev (reserved: rag-demo from source with reload). gpu (T3.1a) and demo (T8.5) are added by those tasks in their own hunks.
# Start it with `make up PROFILES="core live"` (mk/docker.mk exports the host ports = default + PORT_OFFSET,
# D214); a raw `docker compose` needs `make ports-env` first. Every host port binds 127.0.0.1 only and is a
# variable (scripts/check_compose.py). No secrets here: only ${VAR} references.

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  qdrant:
    <<: *service-defaults
    # Qdrant v1.20.0 (decisions.md "Pinned versions"); update tag and digest together.
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    # Add `gpu` here in T3.1a (own hunk): profiles: [core, live, gpu]
    profiles: [core, live]
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    healthcheck:
      # The image has neither curl nor wget: plain HTTP over bash's /dev/tcp, checked inside the container.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
          && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          && grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  llm:
    <<: *service-defaults
    # CPU llama.cpp server, OpenAI-compatible /v1. T1.13 pins the exact server-<version> tag (decisions.md).
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
    profiles: [live]
    # --parallel 1: greedy outputs must not depend on batch composition (AI-36); --jinja: the chat template
    # honours enable_thinking=false for Qwen3 (W1.2). The model file comes from scripts/models/fetch.py (T1.4).
    command: >-
      --model /models/${LIVE_LLM_GGUF:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size 4096
      --threads ${LIVE_LLM_THREADS:-4}
      --parallel 1 --seed 0 --jinja
    ports:
      - "127.0.0.1:${LLM_HOST_PORT:-8080}:8080"
    volumes:
      - ${LIVE_MODEL_DIR:-${HOME}/.cache/pruefstand/models}:/models:ro
    mem_limit: 6g
    healthcheck:
      # Inside the container, so it never depends on the published host port.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # TEI CPU embedding server (T1.13). The model is downloaded on first start into ${LIVE_MODEL_DIR}/tei (pinned
  # revision, license MIT); infra/models/live-models.yaml holds the pin and the SHA-256 of its weights.
  embed:
    <<: *service-defaults
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
    profiles: [live]
    command: >-
      --model-id intfloat/multilingual-e5-small
      --revision 614241f622f53c4eeff9890bdc4f31cfecc418b3
      --port 80
      --tokenization-workers 2
    environment:
      OMP_NUM_THREADS: ${LIVE_EMBED_THREADS:-4}
      MKL_NUM_THREADS: ${LIVE_EMBED_THREADS:-4}
    ports:
      - "127.0.0.1:${EMBED_HOST_PORT:-8090}:80"
    volumes:
      - ${LIVE_MODEL_DIR:-${HOME}/.cache/pruefstand/models}/tei:/data
    mem_limit: 2g
    # The ONNX runtime spins on every core it sees (12 busy cores on the 160-core VM); 4 = the hosted runner.
    cpus: ${LIVE_EMBED_CPUS:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  # The reference RAG app (system under test), built from apps/rag-demo/Dockerfile (T0.3 template). RAG_CONFIG
  # (RAG_DEMO_CONFIG; not RAG_CONFIG, which .env sets to a host path) selects the config inside the image (/app/configs/rag.yaml or /app/configs/bugs/<name>.yaml).
  rag-demo:
    <<: *service-defaults
    profiles: [live]
    # `up` must never reuse an image built from older sources (the build cache keeps this cheap).
    pull_policy: build
    build:
      context: .
      dockerfile: apps/rag-demo/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      qdrant:
        condition: service_healthy
      llm:
        condition: service_healthy
      embed:
        condition: service_healthy
    environment:
      RAG_CONFIG: ${RAG_DEMO_CONFIG:-/app/configs/rag.yaml}
      QDRANT_URL: http://qdrant:6333
      LLM_URL: http://llm:8080
      EMBED_URL: http://embed:80
      LLAMA_CPP_VERSION: ${LIVE_LLAMA_CPP_VERSION:-b12019}
      MODEL_SHA256: ${LIVE_LLM_SHA256:-74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db}
    ports:
      - "127.0.0.1:${RAG_DEMO_HOST_PORT:-8000}:8000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  qdrant_data:
