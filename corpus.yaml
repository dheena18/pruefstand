    - {tenant: stadtwerke_sued, source: "eurlex:32022R2065"}
    - {tenant: stadtwerke_sued, source: "eurlex:32022R1925"}
    - {tenant: stadtwerke_sued, source: "eurlex:32023R2854"}
    - {tenant: stadtwerke_sued, source: "eurlex:32022R0868"}
    - {tenant: stadtwerke_sued, source: "eurlex:32002L0058"}
    - {tenant: stadtwerke_sued, source: "eurlex:32024R2847"}
    - {tenant: stadtwerke_sued, source: "eurlex:32022R2554"}
